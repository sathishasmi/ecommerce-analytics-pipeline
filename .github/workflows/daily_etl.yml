name: Daily ETL Pipeline Refresh

on:
  schedule:
    # Runs automatically at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Enables manual trigger button in GitHub UI

jobs:
  run-etl:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Allows GitHub Actions to commit and push changes back to main

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute ETL Pipeline
        run: python -m src.main

      - name: Commit and Push Updated Database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/database/ecommerce_analytics.db
          
          # Only commit and push if the database file was modified
          git diff --staged --quiet || (git commit -m "chore: automated daily database update [skip ci]" && git push)